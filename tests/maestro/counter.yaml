appId: com.idq61wlm3rjzi.weftp5pcclxr
name: Increment the counter
---
- launchApp
- extendedWaitUntil:
    visible: "Click Me"
    timeout: 60000
# iOS exposes the bold number as a separate accessibility element.
- assertVisible:
    text: "You've pressed the button 0 times[.]|0"
    above: "Click Me"
- tapOn: "Click Me"
- assertVisible:
    text: "You've pressed the button 1 times[.]|1"
    above: "Click Me"
- tapOn: "Click Me"
- assertVisible:
    text: "You've pressed the button 2 times[.]|2"
    above: "Click Me"
